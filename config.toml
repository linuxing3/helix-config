# Linuxing helix config
theme = "base16_transparent"

[editor]
# 真彩支持
true-color = true
bufferline = "always"
cursorline = true
cursorcolumn = false

# 光标样式
[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

# 状态栏定义
[editor.statusline]
left = ["mode", "spacer", "spinner", "spacer", "file-name", "file-modification-indicator"]
center = ["diagnostics","workspace-diagnostics"]
right = [ "selections", "position", "position-percentage", "file-encoding", "file-line-ending", "file-type", ]

[editor.soft-wrap]
enable = true
max-wrap = 25 # increase value to reduce forced mid-word  wrapping
max-indent-retain = 0
wrap-indicator = ""  # set wrap-indicator to "" to hide it

[editor.indent-guides]
render = true
character = "┊" # Some characters that work well: "▏", "┆", "┊", "⸽"
skip-levels = 1

[editor.whitespace.render]
space = "all"
tab = "all"
newline = "none"

[editor.whitespace.characters]
space = " "
nbsp = "⍽"
tab = "→"
newline = "⏎"
tabpad = "·" # Tabs will look like "→···" (depending on tab width)[]

[editor.lsp]
display-messages = true
display-inlay-hints = true

# https://docs.helix-editor.com/keymap.html
[keys.insert.j]
j = ["normal_mode", ":write!"]

[keys.insert]
# just commands
F1 = ":format"
F2 = "rename_symbol"
F3 = [":n", ":insert-output lazygit", ":bc!", ":redraw"]
F4 = [":n", ":insert-output yazi", ":bc!", ":redraw"]
F5 = ":sh doom +org tangle --all %{buffer_name}"
F6 = ":sh just run"

# debug
F7 = "dap_launch"
F8 = "dap_continue"
F9 = "dap_step_in"
F10 = "dap_step_out"
F11 = "goto_definition"
F12 = "goto_implementation"

"C-/" = "toggle_comments"

"C-]" = "indent"
"C-[" = "unindent"

"C-a" = "insert_at_line_start"
"C-e" = "insert_at_line_end"

"C-l" = "move_next_word_end"
"C-h" = "move_prev_word_start"

# multi selection
C-r = ["move_prev_word_start", "move_next_word_end", "search_selection", "select_mode"]

# extend_line_below and up
"S-A-up" = ["move_visual_line_up", "extend_line_below", "delete_selection", "paste_after", "collapse_selection", "move_visual_line_up"]
"S-A-down" = ["extend_line_below", "delete_selection", "paste_after", "collapse_selection"]

# duplicate
"C-d" = ["extend_line_below", "yank", "paste_after", "collapse_selection"]

[keys.normal]
# just commands
F1 = ":format"
F2 = "rename_symbol"
F3 = [":n", ":insert-output lazygit", ":bc!", ":redraw"]
F4 = [":n", ":insert-output yazi", ":bc!", ":redraw"]
F5 = ":sh doom +org tangle --all %{buffer_name}"

# debug
F7 = "dap_launch"
F8 = "dap_continue"
F9 = "dap_step_in"
F10 = "dap_step_out"
F11 = "goto_definition"
F12 = "goto_implementation"

# multi selection
C-r = ["move_prev_word_start", "move_next_word_end", "search_selection", "select_mode"]

# line start and end
"$" = ["split_selection_on_newline", "insert_at_line_end", "normal_mode"]
"0" = ["split_selection_on_newline", "insert_at_line_start", "normal_mode"]

# extend_line_below and up
"S-A-up" = ["move_visual_line_up", "extend_line_below", "delete_selection", "paste_after", "collapse_selection", "move_visual_line_up"]
"S-A-down" = ["extend_line_below", "delete_selection", "paste_after", "collapse_selection"]

# duplicate
"C-d" = ["extend_line_below", "yank", "paste_after", "collapse_selection"]
 
# delete line
U = "kill_to_line_start"
D = "kill_to_line_end"

# comments
"C-/" = "toggle_comments"

# indent
"C-]" = "indent"
"C-[" = "unindent"

# buffer
"C-c" = ":new"
"C-q" = ":wbc!"
H = ":bp"
L = ":bn"

# End of file
G = "goto_last_line"

# close all
Z = ":xa!"

# write buffer
s = ":wa!"

[keys.normal.space]
# command mode
space = "command_mode"

# new scratch buffer
v = ":vnew"
# new buffer
n = ":new"
# close buffer
q = ":bc!"
# write buffer
s = ":wa!"
# close all
z = ":xa!"

[keys.normal.space.f]
# file
f = "file_picker_in_current_directory"
"." = "file_picker"
"s" = "symbol_picker"
# Use fzf to pick files
"z" = ":sh fzf --preview 'bat --style=numbers --color=always --line-range :500 {}' | xargs -r $EDITOR"

[keys.normal.space.b]
# buffer
b = "buffer_picker"
n = ":new"
v = ":vnew"
h = ":hnew"
c = ":wbc!"
o = ":bco!" 

[keys.normal.space.c]
# lsp functions
a = "code_action"
r = "rename_symbol"
f = ":format" 

[keys.normal.space.t]
# theme
a = ":theme ayu_light"
b = ":theme ayu_dark"
c = ":theme github_light"
d = ":theme github_dark"
o = ":theme onedark"
p = ":theme onelight"
t = ":theme tokyonight"
n = ":theme nord" 

[keys.normal.g]
c = "toggle_comments"
R = ":reload"

[keys.normal."\\"]
# lazy config
"[" = ":config-open"
"]" = ":config-reload"
"=" = ":config-open-workspace"
"`" = ":cd ~/"
"1" = ":cd ~/.config/home-manager"
"2" = ":cd ~/.config/nnn/plugins"
"3" = ":cd ~/.local/bin"

[keys.normal."tab"]
tab = ":sh zqantara --final-return 0.1 --tab --name hx --program 'hx %{buffer_name}'"
n = ":pipe-to kitty -e nu"
a = ":pipe-to kitty -e nnn"
h = ":sh zqantara --pane --pos down --program 'home-manager switch --flake /home/efwmc/.config/home-manager -b bak'"
s = ":sh zqantara --pane --pos down --program 'sudo nixos-rebuild switch --flake /home/efwmc/.config/home-manager'"

# Open in tabs
[keys.normal.space.o]
g = ":sh zqantara --final-return 0.1 --tab --name lazygit --program lazygit"
p = ":sh zqantara --final-return 0.1 --tab --name ipython --program 'uv run ipython'"
a = ":sh zqantara --final-return 0.1 --tab --name aider --program aider"

# Open in floating windows
[keys.normal.space.o.f]
p = ":sh zqantara --floating --program 'uv run ipython'"
t = ":sh zqantara --floating --program zsh"
c = ":sh zqantara --floating --program aider"

# Open in panes (embedded windows)
[keys.normal.space.o.w]
p = ":sh zqantara --pane --pos down --program ipython"
t = ":sh zqantara --pane --pos right --program zsh"
c = ":sh zqantara --pane --pos stacked --program aider"

[keys.normal.space."r"]
# Send to named tabs
p = ":pipe-to zqantara --final-return 0.1 --tab --name ipython"
c = ":pipe-to zqantara --final-return 0.1 --tab --name aider"
t = ":pipe-to zqantara --final-return 0.1 --tab --name shell"

# Send to floating windows by position
# 'current' means use current floating window without switching position
"1" = ":pipe-to zqantara --floating --pos current"
"2" = ":pipe-to zqantara --floating --pos up"
"3" = ":pipe-to zqantara --floating --pos down"

# Send to panes by position
"l" = ":pipe-to zqantara --pane --pos 'down right'"
"h" = ":pipe-to zqantara --pane --pos 'down left'"

# Use rg to search for keywords, then fzf to select, and open at the found position
"g" = ":sh rg --line-number --color=never --smart-case \"\" | fzf --delimiter : --preview 'bat --style=numbers --color=always --highlight-line {2} {1}' | awk -F: '{print \"+\"$2\" \"$1}' | xargs -r hx"

[keys.select.space.space]
# Send to named tabs
p = ":pipe-to zqantara --tab --name ipython"
c = ":pipe-to zqantara --final-return 0.1 --tab --name aider"
t = ":pipe-to zqantara --final-return 0.1 --tab --name shell"

# Send to floating windows by position
# 'current' means use current floating window without switching position
"1" = ":pipe-to zqantara --floating --pos current"
"2" = ":pipe-to zqantara --floating --pos up"
"3" = ":pipe-to zqantara --floating --pos down"

# Send to panes by position
"l" = ":pipe-to zqantara --pane --pos 'down right'"
"h" = ":pipe-to zqantara --pane --pos 'down left'"
