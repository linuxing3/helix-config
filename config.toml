# Linuxing helix config
theme = "base16_transparent"
# theme = "catppuccin_mocha"
# theme = "gruvbox_dark_hard"

[editor]
# 真彩支持
true-color = true
bufferline = "always"
cursorline = true
cursorcolumn = false

# 光标样式
[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

# 状态栏定义
[editor.statusline]
left = ["mode", "spacer", "spinner", "spacer", "file-name", "file-modification-indicator"]
center = ["diagnostics","workspace-diagnostics"]
right = [ "selections", "position", "position-percentage", "file-encoding", "file-line-ending", "file-type", ]

[editor.soft-wrap]
enable = true
max-wrap = 25 # increase value to reduce forced mid-word  wrapping
max-indent-retain = 0
wrap-indicator = ""  # set wrap-indicator to "" to hide it

[editor.indent-guides]
render = true
character = "┊" # Some characters that work well: "▏", "┆", "┊", "⸽"
skip-levels = 1

[editor.whitespace.render]
space = "all"
tab = "all"
newline = "none"

[editor.whitespace.characters]
space = " "
nbsp = "⍽"
tab = "→"
newline = "⏎"
tabpad = "·" # Tabs will look like "→···" (depending on tab width)[]

[editor.lsp]
display-messages = true
display-inlay-hints = true

[keys.insert.j]
j = ["normal_mode", ":write!"]

[keys.insert]
# just commands
F1 = [ ":format" ]
F2 = "rename_symbol"
# run lazygit
F3 = [":n", ":insert-output lazygit", ":bc!", ":redraw"]
# open yazi finder
F4 = [":n", ":insert-output yazi", ":bc!", ":redraw"]
# open just
F5 = ":sh zellij run -f -x 10%% -y 10%% --width 80%% --height 80%% -- nu $ZELLIX_MOD/justfile.nu"
# open project
F6 = ":sh zellij run -c -f -x 30%% -y 10%% --width 40%% --height 80%% -- nu $ZELLIX_MOD/project.nu"

C-A-esc = [
  "goto_first_nonwhitespace",
  "select_mode",
  "extend_to_line_end",
  ":sh zellij ac move-focus-or-tab right",
  ":pipe-to sh -c 'zellij ac write-chars \"$(cat)\n\"'",
  ":sh zellij ac move-focus-or-tab left",
  "collapse_selection",
  "insert_mode"
]
C-A-space = [
  "select_mode",
  "extend_to_line_bounds",
  ":sh zellij ac move-focus-or-tab right",
  ":pipe-to sh -c 'zellij ac write-chars \"$(cat)\n\"'",
  ":sh zellij ac move-focus-or-tab left",
  "collapse_selection",
  "insert_mode"
]

"C-/" = "toggle_comments"

"C-]" = "indent"
"C-[" = "unindent"

"C-a" = "insert_at_line_start"
"C-e" = "insert_at_line_end"

"C-l" = "move_next_word_end"
"C-h" = "move_prev_word_start"

# multi selection
C-r = ["move_prev_word_start", "move_next_word_end", "search_selection", "select_mode"]

# extend_line_below and up
"S-A-up" = ["move_visual_line_up", "extend_line_below", "delete_selection", "paste_after", "collapse_selection", "move_visual_line_up"]
"S-A-down" = ["extend_line_below", "delete_selection", "paste_after", "collapse_selection"]

# duplicate
"C-d" = ["extend_line_below", "yank", "paste_after", "collapse_selection"]

[keys.normal]
# just commands
F1 = [ ":format" ]
F2 = "rename_symbol"
# lazygit
F3 = ":sh zellij run -c -f -x 10%% -y 10%% --width 80%% --height 80%% -- nu $ZELLIX_MOD/git.nu"
# open yazi finder
F4 = ":sh zellij run -c -f -x 10%% -y 10%% --width 80%% --height 80%% -- nu $ZELLIX_MOD/yazi.nu"
# open just
F5 = ":sh zellij run -f -x 10%% -y 10%% --width 80%% --height 80%% -- nu $ZELLIX_MOD/justfile.nu"
# open project
F6 = ":sh zellij run -c -f -x 30%% -y 10%% --width 40%% --height 80%% -- nu $ZELLIX_MOD/project.nu"

# debug
F7 = "dap_launch"
F8 = "dap_continue"
F9 = "dap_step_in"
F10 = "dap_step_out"
F11 = "goto_definition"
F12 = "goto_implementation"

# interact with zellij
C-h = ":sh zellij ac move-focus-or-tab left"
C-j = ":sh zellij ac move-focus-or-tab down"
C-k = ":sh zellij ac move-focus-or-tab up"
C-l = ":sh zellij ac move-focus-or-tab right"

C-esc = [
  "goto_first_nonwhitespace",
  "select_mode",
  "extend_to_line_end",
  ":sh zellij ac move-focus-or-tab right",
  ":pipe-to sh -c 'zellij ac write-chars \"$(cat)\n\"'",
  ":sh zellij ac move-focus-or-tab left",
  "move_visual_line_down",
  "goto_first_nonwhitespace",
  "collapse_selection",
  "normal_mode"
]
C-space = [
  "select_mode",
  "extend_to_line_bounds",
  ":sh zellij ac move-focus-or-tab right",
  ":pipe-to sh -c 'zellij ac write-chars \"$(cat)\n\"'",
  ":sh zellij ac move-focus-or-tab left",
  "move_visual_line_down",
  "goto_first_nonwhitespace",
  "collapse_selection",
  "normal_mode"
]

# multi selection
C-r = ["move_prev_word_start", "move_next_word_end", "search_selection", "select_mode"]

# line start and end
"$" = ["split_selection_on_newline", "insert_at_line_end", "normal_mode"]
"0" = ["split_selection_on_newline", "insert_at_line_start", "normal_mode"]

# extend_line_below and up
"S-A-up" = ["move_visual_line_up", "extend_line_below", "delete_selection", "paste_after", "collapse_selection", "move_visual_line_up"]
"S-A-down" = ["extend_line_below", "delete_selection", "paste_after", "collapse_selection"]

# duplicate
"C-d" = ["extend_line_below", "yank", "paste_after", "collapse_selection"]
 
# delete line
U = "kill_to_line_start"
D = "kill_to_line_end"

# comments
"C-/" = "toggle_comments"

# indent
"C-]" = "indent"
"C-[" = "unindent"

# buffer
"C-c" = ":new"
"C-q" = ":wbc!"
H = ":bp"
L = ":bn"

# End of file
G = "goto_last_line"

# close all
Z = ":xa!"

# write buffer
s = ":wa!"


[keys.normal.C-a]
C-a = ":sh zellij run -c -f -x 10%% -y 10%% --width 80%% --height 80%% -- nu"
h = ":sh zellij ac new-pane -d down"
n = ":sh zellij ac new-pane"
v = ":sh zellij ac new-pane -d right"
z = ":sh zellij ac toggle-fullscreen"
m = ":sh zellij run -c -f -x 10%% -y 10%% --width 80%% --height 80%% -- nu $ZELLIX_MOD/neomutt.nu"

[keys.normal.C-t]
n = ":sh zellij ac new-tab"

[keys.normal.space]
# command mode
space = "command_mode"
# files in current directory
"." = "file_picker_in_current_directory"
# new scratch buffer
v = ":vnew"
# new buffer
n = ":new"
# close buffer
q = ":bc!"
# write buffer
s = ":wa!"
# close all
z = ":xa!"
# soft wrap
Z = ":toggle soft-wrap.enable"

[keys.normal.space.e]
# Open with emacsclient in a terminal
"a" = ":sh st -e emacsclient '%{buffer_name}'"
# Open with emacsclient in a zellij overlay pane
"w" = ":pipe-to zellij action new-pane --in-place --close-on-exit --name emacsclient -- emacsclient '%{buffer_name}'"
# Open with emacsclient in a zellij floating pane
"f" = ":pipe-to zellij run -c -f -x 10%% -y 10%% --width 80%% --height 80%% --name emacsclient -- emacsclient '%{buffer_name}'"
# Taking note with zk
n = ":sh zellij run -c -f -x 10%% -y 10%% --width 80%% --height 80%% -- nu $ZELLIX_MOD/zk.nu"
# preview note with glow
p = ":sh zellij run -f -x 10%% -y 10%% --width 80%% --height 80%% -- nu $ZELLIX_MOD/markdown.nu '%{buffer_name}'"

[keys.normal.space.f]
# file
# builtin pickers
"." = "file_picker_in_current_directory"
f = "file_picker"
"s" = "symbol_picker"
# open yazi finder
y = ":sh zellij run -c -f -x 10%% -y 10%% --width 80%% --height 80%% -- nu $ZELLIX_MOD/yazi.nu"
# open nnn finder
n = ":sh zellij run -c -f -x 10%% -y 10%% --width 80%% --height 80%% -- nu $ZELLIX_MOD/nnn.nu"
# open project finder
p = ":sh zellij run -c -f -x 10%% -y 10%% --width 80%% --height 80%% -- nu $ZELLIX_MOD/project.nu"
# terminal
t = ":sh zellij run -c -f -x 10%% -y 10%% --width 80%% --height 80%% -- nu $ZELLIX_MOD/terminal.nu"
# fuzzy finder
"g" = ":pipe-to zellij action new-pane --in-place --close-on-exit --name hx -- rg_hx"

[keys.normal.space.l]
a = ":sh zellij run -c -f -x 10%% -y 10%% --width 80%% --height 80%% -- nu $ZELLIX_MOD/ai.nu"
h = ":sh zellij run -c -f -x 10%% -y 10%% --width 80%% --height 80%% -- nu $ZELLIX_MOD/home-manager.nu"
r = ":sh zellij run -c -f -x 10%% -y 10%% --width 80%% --height 80%% -- nu $ZELLIX_MOD/remap.nu"
m = ":sh zellij run -f -x 10%% -y 10%% --width 80%% --height 80%% -- nu $ZELLIX_MOD/makefile.nu"
j = ":sh zellij run -f -x 10%% -y 10%% --width 80%% --height 80%% -- nu $ZELLIX_MOD/justfile.nu"
s = ":sh zellij run -f -x 10%% -y 10%% --width 80%% --height 80%% -- nu $ZELLIX_MOD/sh.nu"
t = ":sh zellij action start-or-reload-plugin file:$HOME/.config/zellij/plugins/multitask.wasm --configuration \"shell=bash,ccwd=`pwd`\""
# tangle file
g = ":sh zellij run -c -f -x 10%% -y 10%% --width 80%% --height 80%% -- nu $ZELLIX_MOD/tangle.nu %{buffer_name}"

[keys.normal.space.b]
# buffer
b = "buffer_picker"
n = ":new"
v = ":vnew"
h = ":hnew"
c = ":wbc!"
o = ":bco!" 

[keys.normal.space.c]
# lsp functions
a = "code_action"
r = "rename_symbol"
f = ":format" 
i = ":toggle lsp.display-inlay-hints"

[keys.normal.space.t]
# theme
a = ":theme ayu_light"
b = ":theme ayu_dark"
c = ":theme github_light"
d = ":theme github_dark"
e = ":theme catppuccin_latte"
f = ":theme catppuccin_mocha"
o = ":theme onedark"
p = ":theme onelight"
t = ":theme tokyonight"
n = ":theme nord" 

[keys.normal.g]
c = "toggle_comments"
R = ":reload"
t = ":new"
x = ":bc"

[keys.normal."]"]
"]" = ":config-reload"
[keys.normal."["]
"[" = ":config-open"

[keys.normal."\\"]
# lazy config
"=" = ":config-open-workspace"
"1" = ":cd ~/.config/home-manager"
"2" = ":cd ~/.config/helix"
"3" = ":cd ~/.config/zellij"
"4" = ":cd ~/.config/nnn"
"5" = ":cd ~/.config/neomutt"
"6" = ":cd ~/.config/zsh"
"7" = ":cd ~/.config/yazi"
"8" = ":cd ~/.config/chadwm/chadwm"
"9" = ":cd ~/.config/st-sx"
"0" = ":cd ~/.config/zellix"
"n" = ":cd ~/notebooks"
"o" = ":cd ~/Org"

[keys.normal."tab"]
tab = ":sh zellij action new-tab"
e = ":sh zellij run -c -- 'hx'"
f = ":sh zellij run -c -- 'nnn'"
y = ":sh zellij run -c -- 'yazi'"
s = ":pipe-to st -e nu"
n = ":pipe-to st -e nnn"
h = ":sh zellij run -d down -- 'home-manager switch --flake /home/Designers/.config/home-manager -b b'"
o = ":sh zellij run -d down -- 'sudo nixos-rebuild switch --flake /home/Designers/.config/home-manager'"

# Open in tabs
[keys.normal.space.o]
g = ":sh zqantara --final-return 0.1 --tab --name lazygit --program lazygit"
p = ":sh zqantara --final-return 0.1 --tab --name ipython --program 'uv run ipython'"
a = ":sh zqantara --final-return 0.1 --tab --name aider --program 'zsh -ic aider'"
t = ":sh zqantara --final-return 0.1 --tab --name shell --program zsh"

# Open in floating windows
[keys.normal.space.o.f]
p = ":sh zqantara --floating --program 'uv run ipython'"
t = ":sh zqantara --floating --program zsh"
c = ":sh zqantara --floating --program 'zsh -ic aider'"

# Open in panes (embedded windows)
[keys.normal.space.o.w]
t = ":sh zqantara --pane --pos down --program zsh"
r = ":sh zqantara --pane --pos right --program zsh"
p = ":sh zqantara --pane --pos down --program ipython"
a = ":sh zqantara --pane --pos stacked --program 'zsh -ic aider'"

[keys.normal.space.r]
# Send to named tabs
p = ":pipe-to zqantara --final-return 0.1 --tab --name ipython"
a = ":pipe-to zqantara --final-return 0.1 --tab --name 'zsh -ic aider'"
t = ":pipe-to zqantara --final-return 0.1 --tab --name shell"

# Send to floating windows by position
# 'current' means use current floating window without switching position
"1" = ":pipe-to zqantara --floating --pos current"
"2" = ":pipe-to zqantara --floating --pos up"
"3" = ":pipe-to zqantara --floating --pos down"

# Send to panes by position
"l" = ":pipe-to zqantara --pane --pos 'down right'"
"h" = ":pipe-to zqantara --pane --pos 'down left'"

[keys.select.space.r]
# Send to named tabs
p = ":pipe-to zqantara --tab --name ipython"
a = ":pipe-to zqantara --final-return 0.1 --tab --name aider"
s = ":pipe-to zqantara --final-return 0.1 --tab --name shell"

# Send to floating windows by position
# 'current' means use current floating window without switching position
"1" = ":pipe-to zqantara --floating --pos current"
"2" = ":pipe-to zqantara --floating --pos up"
"3" = ":pipe-to zqantara --floating --pos down"

# Send to panes by position
"l" = ":pipe-to zqantara --pane --pos 'down right'"
"h" = ":pipe-to zqantara --pane --pos 'down left'"

[keys.select]
C-A-space = [
  ":sh zellij ac move-focus-or-tab right",
  ":pipe-to sh -c 'rg -v \"^[[:space:]]*$\" | zellij ac write-chars \"$(cat)\n\"'",
  ":sh zellij ac move-focus-or-tab left",
  "collapse_selection",
  "move_visual_line_down",
  "goto_first_nonwhitespace",
  "collapse_selection",
  "normal_mode"
]
